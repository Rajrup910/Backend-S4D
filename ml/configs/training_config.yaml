# Training configuration for Scan4Disease.
#
# Every value here is recorded into the experiment log so a run can be reproduced.
# Override any of these on the command line, e.g.:
#   python -m ml.training.train --arch resnet50 --batch-size 16

seed: 42

data:
  # Root of the raw download. `prepare_dataset.py` indexes whatever layout it finds here.
  dataset_root: data/ham10000
  manifest: ml/data/manifest.csv
  splits: ml/configs/splits/split_v1.csv
  image_size: 224
  num_workers: 4

split:
  # Fractions are over LESIONS, not images -- see split_dataset.py.
  train: 0.70
  val: 0.15
  test: 0.15
  group_column: lesion_id
  stratify_column: dx

augmentation:
  # Kept deliberately conservative. Dermoscopic images have no canonical orientation,
  # so flips and rotations are safe; heavy colour distortion is not, because colour is
  # diagnostically meaningful in pigmented lesions.
  random_resized_crop_scale: [0.8, 1.0]
  horizontal_flip: 0.5
  vertical_flip: 0.5
  rotation_degrees: 20
  brightness: 0.15
  contrast: 0.15
  saturation: 0.10
  hue: 0.02

model:
  # resnet50 | efficientnet_b0
  arch: efficientnet_b0
  pretrained: true
  dropout: 0.3

training:
  epochs: 30
  batch_size: 32
  # Stage 1: backbone frozen, train only the new classifier head.
  head_lr: 1.0e-3
  head_epochs: 3
  # Stage 2: unfreeze the deeper blocks and fine-tune everything at a lower LR.
  finetune_lr: 1.0e-4
  weight_decay: 1.0e-4
  optimizer: adamw
  scheduler: cosine
  label_smoothing: 0.05
  # none | inverse | effective_number
  class_weighting: effective_number
  effective_number_beta: 0.999
  grad_clip_norm: 5.0
  # Metric used to choose the best checkpoint. Chosen BEFORE any test-set evaluation.
  # Macro F1, not accuracy: with nv at ~67% of the data, accuracy rewards guessing.
  monitor_metric: macro_f1
  early_stopping_patience: 8
  amp: true

paths:
  checkpoint_dir: ml/checkpoints
  results_dir: ml/results
  experiment_log: ml/results/experiments.csv
